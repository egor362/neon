
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b1b">
<title>RIFT RUNNER</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
:root {
  --bg:#080b1b;
  --panel:#111832;
  --cyan:#48eaff;
  --purple:#a879ff;
  --pink:#ff5ca8;
  --text:#f3f5ff;
  --muted:#9ba8cc;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:radial-gradient(ellipse at top,#18234a,#080b1b 65%);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  user-select:none;
}
button {
  border:0;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}
button:disabled {opacity:.5;cursor:default}
#app {max-width:520px;margin:auto;padding:16px;min-height:100vh}
.topbar {
  display:flex;justify-content:space-between;align-items:center;
  margin:4px 0 22px;
}
.logo {font-size:23px;font-weight:900;letter-spacing:2px}
.logo span {color:var(--cyan)}
.balance {
  background:#182344;border:1px solid #35466f;
  border-radius:20px;padding:9px 13px;color:#ffe58b;font-weight:bold;
}
h1 {font-size:27px;margin:8px 0}
h2 {font-size:22px;margin:8px 0 16px}
.subtitle {color:var(--muted);font-size:14px;line-height:1.5}
.panel {
  background:linear-gradient(145deg,#172343,#10172d);
  border:1px solid #2b3b65;border-radius:20px;
  padding:18px;margin:14px 0;
  box-shadow:0 10px 30px #0005;
}
.hero {
  text-align:center;padding:28px 18px;
  background:radial-gradient(circle at 50% 35%,#293d77,#121a35 70%);
}
.ship-art {
  font-size:76px;margin:12px 0;
  filter:drop-shadow(0 0 18px #48eaff99);
}
.primary {
  width:100%;padding:16px;border-radius:14px;
  background:linear-gradient(100deg,#18bce8,#765cff);
  box-shadow:0 5px 20px #4b7dff44;
}
.secondary {
  width:100%;padding:14px;border-radius:13px;
  background:#26345b;border:1px solid #40527e;
}
.ad-button {
  width:100%;padding:15px;border-radius:14px;
  background:linear-gradient(100deg,#a66bff,#e34eaa);
}
.button-grid {
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;
}
.small-card {
  background:#182344;border:1px solid #30416c;
  border-radius:15px;padding:14px;text-align:center;
}
.small-card .emoji {font-size:30px;margin-bottom:8px}
.small-card p {color:var(--muted);font-size:12px;margin:6px 0}
.cards {display:grid;grid-template-columns:1fr 1fr;gap:11px}
.item {
  background:#151f3d;border:1px solid #30416c;
  border-radius:16px;padding:14px;text-align:center;
}
.item.selected {border:2px solid var(--cyan);background:#1b3150}
.item .emoji {font-size:43px;margin:8px}
.item .name {font-weight:bold;margin:5px}
.item .desc {font-size:12px;color:var(--muted);min-height:30px}
.item button {margin-top:10px}
.pill {
  display:inline-block;border-radius:20px;padding:5px 9px;
  background:#26385e;color:#bcefff;font-size:11px;
}
.hidden {display:none!important}
.back {margin-bottom:14px;width:auto;padding:10px 15px}
#gameScreen {padding:0}
.game-head {
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 2px 12px;
}
.game-stat {color:#dce8ff;font-size:14px}
#gameCanvas {
  width:100%;height:min(60vh,550px);display:block;
  background:#080d22;border:1px solid #34446f;
  border-radius:17px;touch-action:none;
}
.game-controls {
  display:grid;
  grid-template-columns:repeat(3,58px);
  grid-template-rows:repeat(2,50px);
  gap:8px;
  justify-content:center;
  margin:12px auto;
}
.game-controls button {
  padding:5px;
  border-radius:14px;
  font-size:23px;
  background:linear-gradient(145deg,#263e70,#111d3d);
  border:1px solid #48eaff88;
  box-shadow:0 0 13px #48eaff22;
  touch-action:none;
}
#leftButton {grid-column:1;grid-row:2}
#upButton {grid-column:2;grid-row:1}
#downButton {grid-column:2;grid-row:2}
#rightButton {grid-column:3;grid-row:2}
#toast {
  position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
  background:#202e50;border:1px solid #4a6295;color:white;
  padding:12px 18px;border-radius:12px;z-index:20;
